<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Product Description Generator</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #181b22;
        --border: #262b36;
        --text: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #6d8bff;
        --accent-hover: #5875f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      header {
        padding: 28px 20px 8px;
        text-align: center;
      }
      header h1 { margin: 0 0 4px; font-size: 1.5rem; }
      header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 4px; }
      input, textarea, select {
        width: 100%;
        background: #0f1115;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 10px;
        font-size: 0.95rem;
        font-family: inherit;
      }
      textarea { resize: vertical; min-height: 70px; }
      button {
        margin-top: 16px;
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .result h3 { margin: 0 0 6px; }
      .result .title { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }
      .result .body { white-space: pre-wrap; color: var(--text); }
      .result ul { padding-left: 20px; }
      .result .meta {
        margin-top: 14px;
        font-size: 0.8rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .placeholder { color: var(--muted); }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        background: #3a2f12;
        color: #f0c674;
        border-radius: 6px;
        padding: 2px 6px;
        margin-left: 6px;
      }
      .copy {
        margin-top: 14px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .copy:hover { background: #0f1115; color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <h1>AI Product Description Generator <span id="mode" class="badge" style="display:none"></span></h1>
      <p>Paste a product name and a few details → get store-ready copy.</p>
    </header>

    <div class="wrap">
      <div class="panel">
        <form id="form">
          <label for="productName">Product name *</label>
          <input id="productName" placeholder="e.g. Stainless Steel Insulated Water Bottle" required />

          <label for="features">Features / details</label>
          <textarea id="features" placeholder="750ml, keeps drinks cold 24h, leak-proof lid, matte finish"></textarea>

          <label for="audience">Target customer</label>
          <input id="audience" placeholder="e.g. gym-goers and commuters" />

          <label for="keywords">SEO keywords (optional)</label>
          <input id="keywords" placeholder="insulated water bottle, reusable, BPA-free" />

          <label for="tone">Tone</label>
          <select id="tone">
            <option value="professional">Professional</option>
            <option value="playful">Playful</option>
            <option value="luxury">Luxury</option>
            <option value="minimal">Minimal</option>
          </select>

          <button type="submit" id="submit">Generate description</button>
        </form>
      </div>

      <div class="panel result" id="result">
        <p class="placeholder">Your generated description will appear here.</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("form");
      const result = document.getElementById("result");
      const submit = document.getElementById("submit");

      fetch("/api/health")
        .then((r) => r.json())
        .then((h) => {
          if (h.mode === "demo") {
            const b = document.getElementById("mode");
            b.textContent = "DEMO";
            b.style.display = "inline-block";
          }
        })
        .catch(() => {});

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submit.disabled = true;
        submit.textContent = "Generating…";
        result.innerHTML = '<p class="placeholder">Thinking…</p>';

        const payload = {
          productName: document.getElementById("productName").value,
          features: document.getElementById("features").value,
          audience: document.getElementById("audience").value,
          keywords: document.getElementById("keywords").value,
          tone: document.getElementById("tone").value,
        };

        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Request failed");
          render(data);
        } catch (err) {
          result.innerHTML = '<p class="placeholder">Error: ' + err.message + "</p>";
        } finally {
          submit.disabled = false;
          submit.textContent = "Generate description";
        }
      });

      function render(d) {
        const bullets = (d.bullets || []).map((b) => "<li>" + escapeHtml(b) + "</li>").join("");
        result.innerHTML =
          '<div class="title">' + escapeHtml(d.title || "") + "</div>" +
          '<div class="body">' + escapeHtml(d.description || "") + "</div>" +
          (bullets ? "<ul>" + bullets + "</ul>" : "") +
          (d.metaDescription
            ? '<div class="meta"><strong>Meta:</strong> ' + escapeHtml(d.metaDescription) + "</div>"
            : "") +
          '<button class="copy" id="copy">Copy all</button>';

        document.getElementById("copy").addEventListener("click", () => {
          const text = [
            d.title,
            "",
            d.description,
            "",
            (d.bullets || []).map((b) => "• " + b).join("\n"),
            "",
            "Meta: " + (d.metaDescription || ""),
          ].join("\n");
          navigator.clipboard.writeText(text);
          document.getElementById("copy").textContent = "Copied!";
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
