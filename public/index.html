<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Copy Studio</title>
    <style>
      /* ── Light palette (default) ─────────────────────────────────────── */
      :root {
        --bg: #faf7f6;
        --surface: #ffffff;
        --surface-2: #f5efee;
        --border: #ebe0dd;
        --text: #1e1615;
        --muted: #7a6a67;
        --faint: #a3928e;

        --accent: #d94f42;        /* coral — actions */
        --accent-hover: #c03d31;
        --accent-soft: #fdecea;
        --ring: rgba(217, 79, 66, 0.24);

        --gold: #b07d2a;          /* gold — quality / score */
        --gold-soft: #fbf1dc;
        --gold-line: #e8d5ac;

        --shadow: 0 1px 2px rgba(40, 25, 22, 0.05), 0 10px 28px rgba(40, 25, 22, 0.07);
        --radius: 14px;
      }
      /* ── Dark palette ────────────────────────────────────────────────── */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141010;
          --surface: #1c1716;
          --surface-2: #241d1c;
          --border: #362c2a;
          --text: #ece6e4;
          --muted: #a2938f;
          --faint: #786a67;

          --accent: #ff7d70;
          --accent-hover: #ff958a;
          --accent-soft: #2e1d1b;
          --ring: rgba(255, 125, 112, 0.3);

          --gold: #e6b35c;
          --gold-soft: #2b2117;
          --gold-line: #4a3a22;

          --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px rgba(0, 0, 0, 0.4);
        }
      }
      :root[data-theme="dark"] {
        --bg: #141010;
        --surface: #1c1716;
        --surface-2: #241d1c;
        --border: #362c2a;
        --text: #ece6e4;
        --muted: #a2938f;
        --faint: #786a67;

        --accent: #ff7d70;
        --accent-hover: #ff958a;
        --accent-soft: #2e1d1b;
        --ring: rgba(255, 125, 112, 0.3);

        --gold: #e6b35c;
        --gold-soft: #2b2117;
        --gold-line: #4a3a22;

        --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px rgba(0, 0, 0, 0.4);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.55; -webkit-font-smoothing: antialiased;
      }

      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 15px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .brand { display: flex; align-items: center; gap: 11px; }
      .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent);
        display: grid; place-items: center; color: #fff; flex: none;
        box-shadow: 0 0 0 1px var(--gold-line), 0 2px 8px var(--ring); }
      .brand b { font-size: 1rem; letter-spacing: -0.015em; }
      .brand span { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; }
      .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600;
        color: var(--gold); background: var(--gold-soft); border: 1px solid var(--gold-line);
        padding: 5px 11px; border-radius: 999px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

      .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 24px 60px;
        display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 22px; align-items: start; }
      @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
      .card { background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow); }
      .card-head { padding: 18px 20px 4px; }
      .card-head h2 { margin: 0; font-size: 0.95rem; letter-spacing: -0.01em; }
      .card-head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
      form { padding: 8px 20px 20px; }
      label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--faint); margin: 16px 0 6px; }
      .req { color: var(--accent); }
      input, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); padding: 11px 12px; font: inherit; font-size: 0.92rem;
        transition: border-color 0.15s, box-shadow 0.15s; }
      input::placeholder, textarea::placeholder { color: var(--faint); }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
      textarea { resize: vertical; min-height: 74px; }
      .tones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      @media (max-width: 420px) { .tones { grid-template-columns: repeat(2, 1fr); } }
      .tone { text-align: center; font-size: 0.82rem; padding: 9px 4px; border: 1px solid var(--border);
        border-radius: 9px; background: var(--surface-2); cursor: pointer; user-select: none; transition: all 0.12s; }
      .tone:hover { border-color: var(--accent); }
      .tone.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .btn { margin-top: 20px; width: 100%; background: var(--accent); color: #fff; border: none;
        border-radius: 10px; padding: 13px; font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: background 0.15s, transform 0.05s; }
      .btn:hover { background: var(--accent-hover); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.65; cursor: not-allowed; }
      .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
        border-top-color: #fff; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

      .out { display: flex; flex-direction: column; min-height: 380px; }
      .tabs { display: flex; gap: 6px; padding: 14px 16px 0; border-bottom: 1px solid var(--border); }
      .tab { flex: 1; text-align: center; font-size: 0.82rem; font-weight: 600; padding: 10px 6px; border: none;
        background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
      .tab small { display: block; font-weight: 400; font-size: 0.68rem; color: var(--faint); }
      .out-body { padding: 20px; flex: 1; }
      .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: var(--muted); padding: 40px 24px; gap: 10px; }
      .empty svg { opacity: 0.45; }
      .empty p { margin: 0; font-size: 0.88rem; max-width: 250px; }
      .field-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--faint); margin: 0 0 6px; }
      .result-title { font-size: 1.26rem; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; margin: 0 0 18px; }
      .result-desc { white-space: pre-wrap; font-size: 0.95rem; margin: 0 0 18px; }
      .result-bullets { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; }
      .result-bullets li { display: flex; gap: 10px; font-size: 0.92rem; align-items: flex-start; }
      .result-bullets li::before { content: ""; flex: none; margin-top: 7px; width: 6px; height: 6px;
        border-radius: 50%; background: var(--accent); }
      .meta { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 14px; font-size: 0.83rem; color: var(--muted); margin-bottom: 18px; }
      .meta strong { color: var(--text); font-weight: 600; }
      .meta .count { float: right; font-variant-numeric: tabular-nums; color: var(--faint); }

      /* Listing Score — gold is the "quality" signal */
      .score { background: var(--gold-soft); border: 1px solid var(--gold-line);
        border-radius: 10px; padding: 15px; }
      .score-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
      .score-head h4 { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 6px; }
      .score-overall { font-size: 1.5rem; font-weight: 700; color: var(--gold);
        font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
      .score-overall small { font-size: 0.68rem; color: var(--muted); font-weight: 500; letter-spacing: 0; }
      .bars { display: grid; gap: 9px; }
      .bar-row { display: grid; grid-template-columns: 86px 1fr 32px; align-items: center; gap: 10px; font-size: 0.78rem; }
      .bar-row .lbl { color: var(--muted); }
      .bar-track { height: 6px; background: var(--gold-line); border-radius: 999px; overflow: hidden; opacity: 0.6; }
      .bar-fill { display: block; height: 100%; background: var(--gold); border-radius: 999px; width: 0;
        transition: width 0.65s cubic-bezier(.2,.7,.2,1); }
      .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }

      .out-foot { border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px;
        justify-content: flex-end; background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
      .ghost { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 9px;
        padding: 9px 14px; font: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px; transition: background 0.12s, border-color 0.12s; }
      .ghost:hover { background: var(--surface-2); border-color: var(--accent); }
      .skeleton { display: grid; gap: 14px; padding: 4px 0; }
      .sk { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
        background-size: 200% 100%; border-radius: 7px; animation: shimmer 1.4s infinite; }
      @keyframes shimmer { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
      .badge { display: inline-block; font-size: 0.66rem; font-weight: 700; background: var(--gold-soft);
        color: var(--gold); border: 1px solid var(--gold-line); border-radius: 5px; padding: 1px 6px; margin-left: 7px; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <div>
          <b>Product Copy Studio <span id="mode" class="badge" style="display:none"></span></b>
          <span>AI descriptions for your store</span>
        </div>
      </div>
      <div class="pill"><span class="dot"></span> Ready</div>
    </div>

    <div class="wrap">
      <section class="card">
        <div class="card-head">
          <h2>Product details</h2>
          <p>Give the basics — the AI writes three versions.</p>
        </div>
        <form id="form">
          <label for="name">Product name <span class="req">*</span></label>
          <input id="name" placeholder="Stainless Steel Insulated Water Bottle" required />
          <label for="features">Features / details</label>
          <textarea id="features" placeholder="750ml, keeps drinks cold 24h, leak-proof lid, matte finish"></textarea>
          <label for="audience">Target customer</label>
          <input id="audience" placeholder="gym-goers and commuters" />
          <label for="keywords">SEO keywords <span style="text-transform:none;font-weight:400;letter-spacing:0">(optional)</span></label>
          <input id="keywords" placeholder="insulated water bottle, reusable, BPA-free" />
          <label>Tone</label>
          <div class="tones" id="tones">
            <div class="tone active" data-tone="professional">Professional</div>
            <div class="tone" data-tone="playful">Playful</div>
            <div class="tone" data-tone="luxury">Luxury</div>
            <div class="tone" data-tone="minimal">Minimal</div>
          </div>
          <button type="submit" class="btn" id="go">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            Generate 3 versions
          </button>
        </form>
      </section>

      <section class="card out">
        <div id="tabs" class="tabs" style="display:none"></div>
        <div class="out-body" id="out">
          <div class="empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
            <p>Your three versions will appear here. Fill in a product and hit generate.</p>
          </div>
        </div>
        <div class="out-foot" id="foot" style="display:none">
          <button class="ghost" id="regen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            Regenerate
          </button>
          <button class="ghost" id="copy">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Copy this version
          </button>
        </div>
      </section>
    </div>

    <script>
      const LABELS = { snappy: "Snappy", balanced: "Balanced", indepth: "In-Depth" };
      const SUBS = { snappy: "short & punchy", balanced: "the all-rounder", indepth: "rich & detailed" };

      let tone = "professional";
      const tonesEl = document.getElementById("tones");
      tonesEl.addEventListener("click", (e) => {
        const t = e.target.closest(".tone");
        if (!t) return;
        tonesEl.querySelectorAll(".tone").forEach((x) => x.classList.remove("active"));
        t.classList.add("active");
        tone = t.dataset.tone;
      });

      const form = document.getElementById("form");
      const out = document.getElementById("out");
      const tabs = document.getElementById("tabs");
      const foot = document.getElementById("foot");
      const go = document.getElementById("go");

      let variants = [];
      let active = 0;

      fetch("/api/health").then((r) => r.json()).then((h) => {
        if (h.mode === "demo") {
          const b = document.getElementById("mode");
          b.textContent = "DEMO";
          b.style.display = "inline-block";
        }
      }).catch(() => {});

      const overall = (s) => Math.round((s.seo + s.readability + s.persuasion + s.clarity) / 4);

      function renderTabs() {
        tabs.style.display = "flex";
        tabs.innerHTML = variants.map((v, i) =>
          '<button class="tab ' + (i === active ? "active" : "") + '" data-i="' + i + '">' +
          (LABELS[v.id] || v.id) + '<small>' + (SUBS[v.id] || "") + '</small></button>'
        ).join("");
        tabs.querySelectorAll(".tab").forEach((t) =>
          t.addEventListener("click", () => { active = +t.dataset.i; renderTabs(); renderActive(); })
        );
      }

      const bar = (label, val) => '<div class="bar-row"><span class="lbl">' + label + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + val + '%"></span></span>' +
        '<span class="val">' + val + '</span></div>';

      function renderActive() {
        const d = variants[active];
        const bullets = (d.bullets || []).map((b) => "<li>" + esc(b) + "</li>").join("");
        const s = d.scores || { seo: 0, readability: 0, persuasion: 0, clarity: 0 };
        out.innerHTML =
          '<p class="field-label">Title</p><h1 class="result-title">' + esc(d.title || "") + "</h1>" +
          '<p class="field-label">Description</p><p class="result-desc">' + esc(d.description || "") + "</p>" +
          (bullets ? '<p class="field-label">Selling points</p><ul class="result-bullets">' + bullets + "</ul>" : "") +
          (d.metaDescription ? '<div class="meta"><span class="count">' + d.metaDescription.length +
            ' chars</span><strong>SEO meta:</strong> ' + esc(d.metaDescription) + "</div>" : "") +
          '<div class="score"><div class="score-head"><h4>' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>' +
          ' Listing Score</h4><div class="score-overall">' + overall(s) + '<small>/100</small></div></div>' +
          '<div class="bars">' + bar("SEO", s.seo) + bar("Readability", s.readability) +
          bar("Persuasion", s.persuasion) + bar("Clarity", s.clarity) + "</div></div>";
        requestAnimationFrame(() => {
          out.querySelectorAll(".bar-fill").forEach((el) => {
            const w = el.style.width; el.style.width = "0"; requestAnimationFrame(() => (el.style.width = w));
          });
        });
      }

      function skeleton() {
        tabs.style.display = "none";
        out.innerHTML = '<div class="skeleton">' +
          '<div class="sk" style="height:14px;width:35%"></div>' +
          '<div class="sk" style="height:26px;width:80%"></div>' +
          '<div class="sk" style="height:12px;width:100%"></div>' +
          '<div class="sk" style="height:12px;width:92%"></div>' +
          '<div class="sk" style="height:12px;width:70%"></div>' +
          '<div class="sk" style="height:60px;width:100%;margin-top:8px"></div></div>';
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        if (!name) return;
        go.disabled = true;
        go.innerHTML = '<span class="spinner"></span> Writing three versions…';
        foot.style.display = "none";
        skeleton();
        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              productName: name,
              features: document.getElementById("features").value,
              audience: document.getElementById("audience").value,
              keywords: document.getElementById("keywords").value,
              tone,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Request failed");
          variants = data.variants || [];
          active = 1;
          renderTabs();
          renderActive();
          foot.style.display = "flex";
        } catch (err) {
          out.innerHTML = '<div class="empty" style="min-height:200px"><p>Error: ' + esc(err.message) + "</p></div>";
        } finally {
          go.disabled = false;
          go.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg> Generate 3 versions';
        }
      });

      document.getElementById("regen").addEventListener("click", () => form.requestSubmit());
      document.getElementById("copy").addEventListener("click", (e) => {
        const d = variants[active];
        if (!d) return;
        const text = [d.title, "", d.description, "",
          (d.bullets || []).map((b) => "• " + b).join("\n"), "", "Meta: " + (d.metaDescription || "")].join("\n");
        navigator.clipboard.writeText(text);
        const btn = e.currentTarget, orig = btn.innerHTML;
        btn.textContent = "✓ Copied";
        setTimeout(() => { btn.innerHTML = orig; }, 1400);
      });

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    </script>
  </body>
</html>
